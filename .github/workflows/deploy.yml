name: Deploy

# CD: al hacer merge a main se construye, se publica en ECR y se despliega en ECS.
# Tambien se puede lanzar a mano; con rollback_sha vuelve a una imagen anterior.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "SHA de una imagen ya publicada en ECR para volver a ella (vacio = desplegar el commit actual)"
        required: false
        default: ""

permissions:
  id-token: write   # necesario para OIDC con AWS
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE_SERVER: ${{ vars.ECS_SERVICE_SERVER }}
  ECS_SERVICE_WORKER: ${{ vars.ECS_SERVICE_WORKER }}
  IMAGE_TAG: ${{ github.event.inputs.rollback_sha || github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Credenciales AWS (OIDC, sin llaves almacenadas)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push (omitido en rollback)
        if: ${{ github.event.inputs.rollback_sha == '' }}
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build --build-arg GIT_SHA="$IMAGE_TAG" -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Descargar task definitions actuales
        run: |
          set -euo pipefail
          for role in server worker; do
            svc_var="ECS_SERVICE_${role^^}"
            family=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "${!svc_var}" \
              --query 'services[0].taskDefinition' --output text)
            aws ecs describe-task-definition --task-definition "$family" \
              --query taskDefinition > "task-$role.json"
          done

      - name: Render task definition del servidor
        id: render-server
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-server.json
          container-name: server
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Render task definition del worker
        id: render-worker
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-worker.json
          container-name: worker
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Desplegar servidor (espera a que sea estable)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-server.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_SERVER }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Desplegar worker (espera a que sea estable)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-worker.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_WORKER }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Smoke test
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/healthz" || true)
            echo "intento $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "La aplicacion no respondio 200 en /healthz" >&2
          exit 1
